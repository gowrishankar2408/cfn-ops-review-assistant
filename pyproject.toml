[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfn-ops-review-assistant"
version = "0.1.0"
description = "CFN Operations Review Assistant"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "requests",
    "pydantic",
    "python-dotenv"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cfn-ops-review-assistant = "cfn_ops_review_assistant.cli.app:main"